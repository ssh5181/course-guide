<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GNU | 학습자중심수업 유형 탐색 및 신청서 작성</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          },
          colors: {
            gnu: {
              sky: '#008CD6',      /* 로고 메인 하늘색 */
              dark: '#006BA6',     /* 호버 및 강조용 딥 스카이 */
              light: '#E6F4FC',    /* 배경 및 뱃지용 연한 하늘색 */
              charcoal: '#414951', /* 로고 텍스트 다크 그레이 */
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: linear-gradient(135deg, #F0F8FF 0%, #E1F1FA 100%);
      min-height: 100vh;
    }
    .fade-in {
      animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    main { transition: max-width .25s ease; }
    main.wide { max-width: 64rem !important; overflow: visible !important; }
    .hidden { display: none !important; }

    /* ----- 신청서 폼 ----- */
    .form-top { display:flex; flex-wrap:wrap; justify-content:space-between; gap:1rem; align-items:flex-start; }
    .type-pill { display:inline-block; background:#008CD6; color:#fff; font-weight:900; font-size:.8rem; padding:.2rem .6rem; border-radius:.5rem; }
    .form-title { font-size:1.4rem; font-weight:800; margin-top:.4rem; color:#414951; }
    .form-subtitle { font-size:.78rem; color:#94a3b8; margin-top:.2rem; }
    .form-actions { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
    .guess-legend { margin-top:1rem; font-size:.78rem; color:#78590a; background:#fffbeb; border:1px solid #fde68a; padding:.6rem .8rem; border-radius:.75rem; line-height:1.6; }
    .guess { display:inline-block; margin-left:.35rem; font-size:.65rem; font-weight:800; color:#92400e; background:#fef3c7; border:1px dashed #f59e0b; padding:0 .35rem; border-radius:.35rem; cursor:help; vertical-align:middle; line-height:1.4; }
    .form-nav { position:sticky; top:0; z-index:20; display:flex; gap:.3rem; overflow-x:auto; background:rgba(255,255,255,.96); backdrop-filter:blur(4px); margin:1rem -0.25rem 0; padding:.6rem .25rem; border-bottom:1px solid #f1f5f9; }
    .form-nav a { white-space:nowrap; font-size:.78rem; font-weight:700; color:#006BA6; background:#E6F4FC; padding:.3rem .65rem; border-radius:999px; }
    .form-nav a:hover { background:#008CD6; color:#fff; }
    .fill-meter { display:flex; align-items:center; gap:.6rem; margin-top:.75rem; font-size:.75rem; color:#64748b; font-weight:700; }
    .fill-bar { flex:1; height:.4rem; background:#f1f5f9; border-radius:999px; overflow:hidden; }
    .fill-bar > div { height:100%; background:#008CD6; transition:width .3s; }
    .fsec { margin-top:2rem; scroll-margin-top:4rem; }
    .fsec-title { font-size:1.1rem; font-weight:800; color:#414951; padding-bottom:.5rem; border-bottom:2px solid #008CD6; }
    .fsec-sub { font-size:.8rem; color:#64748b; margin-top:.5rem; line-height:1.6; }
    .frow { display:grid; grid-template-columns: 11rem 1fr; gap:.75rem; padding:.75rem 0; border-bottom:1px solid #f1f5f9; }
    .flabel { font-size:.85rem; font-weight:700; color:#414951; padding-top:.45rem; line-height:1.4; }
    .frow.req .flabel::after { content:' *'; color:#008CD6; }
    .fbody { min-width:0; }
    @media (max-width: 640px) { .frow { grid-template-columns: 1fr; gap:.35rem; } .flabel { padding-top:0; } }
    .inp { width:100%; border:1px solid #e2e8f0; border-radius:.6rem; padding:.45rem .65rem; font-size:.88rem; background:#fff; color:#334155; }
    .inp:focus { outline:none; border-color:#008CD6; box-shadow:0 0 0 3px rgba(0,140,214,.15); }
    textarea.inp { resize:vertical; line-height:1.55; }
    .inp.num { text-align:center; min-width:3.5rem; }
    .inp.w-auto { width:auto; }
    .inp.w-16 { width:4rem; } .inp.w-20 { width:5rem; } .inp.w-24 { width:6rem; } .inp.w-32 { width:8rem; } .inp.w-48 { width:12rem; max-width:100%; }
    .inp::placeholder { color:#b8c2cf; }
    .chips { display:flex; flex-wrap:wrap; gap:.35rem; }
    .chip input { position:absolute; opacity:0; pointer-events:none; }
    .chip span { display:inline-block; font-size:.82rem; font-weight:600; border:1px solid #e2e8f0; color:#475569; padding:.35rem .75rem; border-radius:.6rem; cursor:pointer; background:#fff; }
    .chip input:checked + span { background:#008CD6; border-color:#008CD6; color:#fff; }
    .chip input:focus-visible + span { box-shadow:0 0 0 3px rgba(0,140,214,.3); }
    .cond { margin-top:.5rem; display:flex; align-items:center; gap:.4rem; font-size:.85rem; color:#475569; }
    .hint { font-size:.75rem; color:#94a3b8; margin-top:.35rem; line-height:1.55; }
    .warn { font-size:.8rem; color:#b91c1c; background:#fef2f2; padding:.5rem .75rem; border-radius:.6rem; margin-top:.75rem; }
    .fixed-val { display:inline-block; padding:.35rem .75rem; background:#f1f5f9; border-radius:.6rem; font-weight:700; font-size:.85rem; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
    @media (max-width: 640px) { .grid2 { grid-template-columns:1fr; } }
    .stack { display:flex; flex-direction:column; gap:.35rem; }
    .sublabel { display:block; font-size:.78rem; font-weight:700; color:#64748b; margin-top:.35rem; }
    .sublabel .inp { margin-top:.2rem; font-weight:400; }
    .card { border:1px solid #e2e8f0; border-radius:1rem; padding:1rem; margin-top:.9rem; background:#fcfdff; }
    .card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:.4rem; color:#414951; }
    .link-btn { font-size:.78rem; color:#94a3b8; font-weight:700; }
    .link-btn:hover { color:#dc2626; }
    .add-btn { margin-top:.6rem; font-size:.82rem; font-weight:700; color:#008CD6; border:1px dashed #7dd3fc; padding:.45rem .9rem; border-radius:.6rem; }
    .add-btn:hover { background:#E6F4FC; }
    .consent { margin-top:1rem; font-size:.8rem; color:#475569; background:#f8fafc; padding:.9rem; border-radius:.75rem; line-height:1.6; }
    .consent .chips { margin-top:.5rem; }
    .h4 { font-size:.92rem; font-weight:800; color:#414951; margin-top:1.1rem; }
    .tbl-wrap { overflow-x:auto; margin-top:.5rem; }
    .tbl { width:100%; border-collapse:collapse; font-size:.83rem; }
    .tbl th, .tbl td { border:1px solid #e2e8f0; padding:.4rem; vertical-align:top; }
    .tbl thead th { background:#E6F4FC; color:#006BA6; font-weight:800; text-align:center; }
    .tbl tbody th { background:#f8fafc; font-weight:700; text-align:center; }
    .tbl td.cat { font-weight:700; color:#414951; background:#fcfdff; }
    .tbl td.cat.cont { border-top-color:transparent; }
    .tbl.weeks td { min-width:9rem; }
    .chk { display:block; font-size:.8rem; padding:.15rem 0; }
    .sum { display:inline-block; min-width:3rem; text-align:center; font-weight:900; padding:.3rem; border-radius:.5rem; background:#f1f5f9; }
    .sum.ok { background:#dcfce7; color:#166534; }
    .sum.bad { background:#fee2e2; color:#b91c1c; }
    .lc-counter { margin-top:.75rem; font-size:.83rem; color:#475569; }
    .ok-badge { margin-left:.3rem; font-size:.72rem; font-weight:800; color:#166534; background:#dcfce7; padding:.1rem .45rem; border-radius:.4rem; }
    .bad-badge { margin-left:.3rem; font-size:.72rem; font-weight:800; color:#b91c1c; background:#fee2e2; padding:.1rem .45rem; border-radius:.4rem; }
    .form-footer { position:sticky; bottom:0; z-index:20; margin:2rem -1.5rem -1.5rem; padding:.9rem 1.5rem; background:rgba(255,255,255,.97); border-top:1px solid #e2e8f0; display:flex; flex-wrap:wrap; gap:.6rem; justify-content:space-between; align-items:center; }
    @media (min-width:640px) { .form-footer { margin:2rem -2.5rem -2.5rem; padding:.9rem 2.5rem; } }
    .form-footer-btns { display:flex; flex-wrap:wrap; gap:.4rem; }
    @media (max-width:640px) { .form-footer { position:static; } }
    .tbl tbody th, .tbl td.cat { min-width:4.5rem; word-break:keep-all; }
    .tbl thead th { word-break:keep-all; white-space:nowrap; }
    .save-status { font-size:.75rem; color:#94a3b8; }
    .btn-primary { font-size:.82rem; font-weight:800; color:#fff; background:#008CD6; padding:.5rem .9rem; border-radius:.65rem; }
    .btn-primary:hover { background:#006BA6; }
    .btn-primary:disabled { background:#cbd5e1; cursor:not-allowed; }
    .btn-ghost { display:inline-block; font-size:.82rem; font-weight:700; color:#475569; border:1px solid #e2e8f0; background:#fff; padding:.5rem .9rem; border-radius:.65rem; }
    .btn-ghost:hover { background:#f8fafc; }
    .btn-ghost.danger:hover { color:#dc2626; border-color:#fecaca; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

    /* ----- 초안 미리보기(문서 모양) ----- */
    .doc { font-size:.85rem; color:#111827; line-height:1.6; }
    .doc h1 { font-size:1.15rem; font-weight:800; text-align:center; text-decoration:underline; margin-bottom:1rem; }
    .doc h2 { font-size:1.02rem; font-weight:800; margin:1.2rem 0 .4rem; }
    .doc h3 { font-size:.95rem; font-weight:800; margin:1rem 0 .4rem; }
    .doc h4 { font-size:.9rem; font-weight:700; margin:.9rem 0 .3rem; }
    .doc table { width:100%; border-collapse:collapse; margin:.3rem 0 .6rem; }
    .doc th, .doc td { border:1px solid #6b7280; padding:.3rem .45rem; vertical-align:top; }
    .doc th { background:#f3f4f6; font-weight:700; width:9rem; }
    .doc .c { text-align:center; }
    .doc .r { text-align:right; margin-top:1rem; }
    .doc .empty { color:#d1d5db; }
    @media print {
      body.previewing > *:not(#preview-modal) { display:none !important; }
      body.previewing { background:#fff !important; }
      body.previewing #preview-modal { position:static; background:none; padding:0; display:block !important; }
      body.previewing .preview-bar { display:none !important; }
      body.previewing .preview-sheet { box-shadow:none; max-width:none; border-radius:0; }
    }

    .compass-spin {
      animation: gentleFloat 3s ease-in-out infinite;
    }
    @keyframes gentleFloat {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(6deg); }
    }
  </style>
</head>
<body class="text-gnu-charcoal antialiased flex flex-col items-center justify-center p-4 sm:p-6">

  <!-- 메인 컨테이너 -->
  <main class="w-full max-w-xl bg-white rounded-3xl shadow-xl border border-sky-100 overflow-hidden">
    
    <!-- 상단 대학 시그니처 헤더 -->
    <header class="bg-white border-b border-slate-100 px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3.5">
        <!-- 대학 로고 PNG 이미지 -->
        <img src="./logo.png" alt="경상국립대학교 로고" class="h-6 sm:h-7 w-auto shrink-0 object-contain" />
        <div class="h-6 w-[1px] bg-slate-200"></div>
        <div class="flex flex-col justify-center">
          <p class="text-[14px] sm:text-[15px] font-extrabold tracking-tight text-gnu-charcoal leading-tight">경상국립대학교</p>
          <p class="text-[8.5px] sm:text-[9.5px] font-bold tracking-[0.02em] text-[#5A626A] leading-tight mt-0.5">GYEONGSANG NATIONAL UNIVERSITY</p>
        </div>
      </div>
      <span class="text-[10px] sm:text-xs font-bold text-gnu-sky bg-gnu-light px-2.5 py-1 rounded-full shrink-0">
        수업 개발 가이드
      </span>
    </header>

    <!-- 진행률 표시 바 -->
    <div id="progress-container" class="hidden w-full bg-slate-100 h-1.5">
      <div id="progress-bar" class="bg-gnu-sky h-1.5 transition-all duration-300" style="width: 25%"></div>
    </div>

    <!-- 콘텐츠 영역 -->
    <div id="app-content" class="p-6 sm:p-10"></div>

    <!-- 하단 푸터 -->
    <footer class="bg-slate-50 px-6 py-3.5 border-t border-slate-100 flex items-center justify-between text-[11px] sm:text-xs text-slate-400">
      <span>학습자 중심 수업 개발 구분 가이드</span>
      <button onclick="openFaqModal()" class="text-gnu-sky hover:text-gnu-dark font-semibold underline underline-offset-2 transition">
        자주 묻는 질문 (FAQ)
      </button>
    </footer>
  </main>

  <!-- FAQ 모달 -->
  <div id="faq-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl fade-in">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div class="flex items-center gap-2">
          <span class="bg-gnu-sky text-white text-xs font-bold px-2 py-0.5 rounded">FAQ</span>
          <h3 class="font-bold text-lg text-gnu-charcoal">수업 유형 선택 유의사항</h3>
        </div>
        <button onclick="closeFaqModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="mt-4 space-y-4 text-sm">
        <div class="bg-gnu-light/60 p-4 rounded-xl border border-sky-100">
          <p class="font-bold text-gnu-dark mb-1">Q1. 플립러닝(FL) 형태로 진행되지만 매 시간 수업 중 활동에서 PBL이 수행된다면?</p>
          <p class="text-gnu-charcoal font-medium">👉 <span class="text-gnu-sky font-bold">플립러닝(FL)</span>로 신청하시면 됩니다.</p>
        </div>
        <div class="bg-gnu-light/60 p-4 rounded-xl border border-sky-100">
          <p class="font-bold text-gnu-dark mb-1">Q2. 매 수업 시간은 PBL로 진행되지만 학기말에 최종 산출물이 제작되는 방식이라면?</p>
          <p class="text-gnu-charcoal font-medium">👉 <span class="text-gnu-sky font-bold">PjBL (프로젝트기반학습)</span>로 신청하시면 됩니다.</p>
        </div>
      </div>
      <button onclick="closeFaqModal()" class="mt-6 w-full py-2.5 bg-gnu-charcoal text-white rounded-xl font-semibold hover:bg-slate-700 transition">
        확인
      </button>
    </div>
  </div>

  <!-- 신청서 초안 미리보기 -->
  <div id="preview-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 flex items-start justify-center p-2 sm:p-6 overflow-y-auto">
    <div class="preview-sheet bg-white rounded-2xl w-full max-w-4xl shadow-2xl fade-in">
      <div class="preview-bar flex items-center justify-between gap-2 px-5 py-3 border-b border-slate-100 sticky top-0 bg-white rounded-t-2xl">
        <strong class="text-gnu-charcoal text-sm sm:text-base">신청서 초안 미리보기</strong>
        <div class="flex gap-2">
          <button type="button" class="btn-ghost whitespace-nowrap" data-action="print-preview">인쇄 / PDF 저장</button>
          <button type="button" class="btn-primary whitespace-nowrap" data-action="close-preview">닫기</button>
        </div>
      </div>
      <div id="preview-body" class="doc px-5 sm:px-10 py-6"></div>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] max-w-md w-[calc(100%-2rem)] bg-gnu-charcoal text-white text-sm px-4 py-3 rounded-xl shadow-xl" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="./js/form-schema.js"></script>
  <script src="./js/hwpx-export.js"></script>
  <script src="./js/form-app.js"></script>
  <script>
    // 질문 데이터
    const questions = {
      q1: {
        step: 1,
        progress: 25,
        badge: 'STEP 01 · 사전학습 여부',
        text: '학생이 사전학습 후,\n활동 중심 수업으로 진행되나요?',
        subText: '온라인 강의·자료 등으로 수업 전 핵심 개념을 미리 학습하고, 본 수업에서는 토론·실습 등 학생 활동을 중심으로 운영하는 방식',
        yes: { type: 'result', target: 'FL' },
        no: { type: 'question', target: 'q2' }
      },
      q2: {
        step: 2,
        progress: 50,
        badge: 'STEP 02 · 차시별 문제해결',
        text: '매 수업마다 문제상황을 제시하고,\n그 시간 안에 해결하나요?',
        subText: '매 수업 차시에 교수자가 실제적인 문제상황을 제시하고, 해당 수업 시간 내에 문제 해결 과정을 수행하는 방식',
        yes: { type: 'question', target: 'q2_1' },
        no: { type: 'question', target: 'q3' }
      },
      q2_1: {
        step: 3,
        progress: 80,
        badge: 'STEP 03 · 산업체 연계 여부',
        text: '문제상황을 기업과\n연계(내용 및 평가)하나요?',
        subText: '수업에서 다루는 문제상황의 설정, 진행 내용 또는 결과 평가 과정에 산업체(기업)가 직접 참여하거나 연계되는 방식',
        yes: { type: 'result', target: 'IC_PBL' },
        no: { type: 'result', target: 'PBL' }
      },
      q3: {
        step: 3,
        progress: 65,
        badge: 'STEP 03 · 최종 산출물 목표',
        text: '학기말에 최종 산출물을 완성하고\n공유하는 것을 목표로 하나요?',
        subText: '매 수업 차시에 조별·개별 프로젝트를 수행하여 학기말에 구체적인 최종 결과물(작품, 보고서, 시제품 등)을 도출하는 방식',
        yes: { type: 'question', target: 'q3_1' },
        no: { type: 'result', target: 'NONE' }
      },
      q3_1: {
        step: 4,
        progress: 85,
        badge: 'STEP 04 · 기업 연계 여부',
        text: '최종 산출물이 기업과\n연계되어 있나요?',
        subText: '학생들이 한 학기 동안 완성하는 최종 프로젝트 산출물이 기업의 실제 수요·주제와 연계되어 진행되는 방식',

        no: { type: 'result', target: 'PJBL' }
      }
    };

    // 결과 데이터
    const results = {
      FL: {
        code: 'FL',
        title: '플립러닝',
        engTitle: 'Flipped Learning',
        tag: '사전학습 + 활동 중심 수업',
        description: '학생이 사전학습을 수행하며, 본 수업은 토론·협력·실습 등 활동을 중심으로 진행됩니다.',
        tip: '💡 FL 형태로 진행되면서 매 시간 수업 중 활동에서 PBL이 함께 수행되는 경우에도 <strong>플립러닝(FL)</strong>으로 신청하시면 됩니다.',
        icon: `<svg class="w-10 h-10 text-gnu-sky" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>`
      },
      PBL: {
        code: 'PBL',
        title: '문제기반학습',
        engTitle: 'Problem Based Learning',
        tag: '차시별 문제해결 중심',
        description: '매 수업 차시에 교수자가 문제상황을 제시하고, 차시 내 수업에서 학생들이 주도적으로 문제를 해결합니다.',
        tip: '💡 만약 매 수업 시간은 PBL로 진행되더라도 <strong>학기말에 최종 산출물이 제작되는 방식</strong>이라면 <strong>PjBL</strong>로 신청해 주세요.',
        icon: `<svg class="w-10 h-10 text-gnu-sky" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>`
      },
      IC_PBL: {
        code: 'IC-PBL',
        title: '산업체연계 문제기반학습',
        engTitle: 'Industry Coupled Problem Based Learning',
        tag: '기업 연계 + 차시별 문제해결',
        description: '수업에서 제시하는 실제적인 문제상황을 기업과 연계(내용 구성 및 평가 등)하여 진행합니다.',
        tip: '💡 매 수업 차시 내 문제 해결이 핵심이며, 기업 현장의 실제 이슈를 수업에 접목하는 교수법입니다.',
        icon: `<svg class="w-10 h-10 text-gnu-sky" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>`
      },
      PJBL: {
        code: 'PjBL',
        title: '프로젝트기반학습',
        engTitle: 'Project Based Learning',
        tag: '학기말 최종 산출물 완성',
        description: '매 수업 차시에 조별활동을 수행하여 학기말에 최종 산출물을 완성하고 공유합니다.',
        tip: '💡 매 차시 PBL 활동을 하더라도 학기말 최종 산출물 완성이 목표라면 PjBL에 해당합니다.',
        icon: `<svg class="w-10 h-10 text-gnu-sky" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>`
      },
      IC_PJBL: {
        code: 'IC-PjBL',
        title: '산업체연계 프로젝트기반학습',
        engTitle: 'Industry Coupled Project Based Learning',
        tag: '기업 연계 + 최종 산출물 완성',
        description: '학생이 한 학기 동안 완성하는 최종 프로젝트 산출물을 기업과 연계하여 진행합니다.',
        tip: '💡 산업체의 요구사항을 반영한 결과물을 학기말에 도출하고 공유하는 산학연계형 프로젝트 수업입니다.',
        icon: `<svg class="w-10 h-10 text-gnu-sky" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>`
      },
      NONE: {
        code: 'GUIDE',
        title: '수업 설계 재확인 안내',
        engTitle: 'General Lecture / Redesign Needed',
        tag: '학습자 중심 요소 확인 필요',
        description: '선택하신 응답 경로는 사전학습 활동(FL), 차시별 문제해결(PBL), 학기말 산출물(PjBL) 요건에 직접 해당하지 않습니다.',
        tip: '💡 학습자 중심 수업을 개발하고자 하신다면, <strong>① 사전학습 도입 ② 차시별 문제상황 제시 ③ 학기말 산출물 도출</strong> 중 한 가지 이상의 요소를 수업에 반영해 보세요.',
        icon: `<svg class="w-10 h-10 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`
      }
    };

    let historyStack = [];
    const appContent = document.getElementById('app-content');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');

    // 초기 시작 화면 렌더링
    function renderStart() {
      historyStack = [];
      document.querySelector('main').classList.remove('wide');
      const savedType = window.getSavedDraftType ? window.getSavedDraftType() : null;
      progressContainer.classList.add('hidden');
      appContent.innerHTML = `
        <div class="text-center py-4 fade-in">
          <!-- 나침반 일러스트 아이콘 -->
          <div class="w-24 h-24 mx-auto mb-6 bg-gnu-light rounded-full flex items-center justify-center border-4 border-sky-200 shadow-inner">
            <svg class="w-14 h-14 text-gnu-sky compass-spin" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="32" cy="32" r="28" stroke="#008CD6" stroke-width="3.5" fill="white"/>
              <path d="M32 8V12M32 52V56M8 32H12M52 32H56" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
              <polygon points="21,21 36,28 28,36" fill="#008CD6"/>
              <polygon points="43,43 28,36 36,28" fill="#CBD5E1"/>
              <circle cx="32" cy="32" r="3.5" fill="#414951"/>
            </svg>
          </div>

          <span class="inline-block text-xs font-bold tracking-wider text-gnu-sky uppercase bg-gnu-light px-3 py-1 rounded-full mb-3">
            Learner-Centered Course Compass
          </span>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-gnu-charcoal tracking-tight leading-snug">
            내 수업 유형 탐색하기
          </h1>
          <p class="mt-3 text-sm sm:text-base text-slate-500 leading-relaxed break-keep">
            몇 가지 간단한 질문에 답하시면 교수님의 수업 방식에<br class="hidden sm:inline" />
            가장 적합한 <strong class="text-gnu-charcoal">학습자 중심 수업 유형(5종)</strong>을 바로 찾아드립니다.
          </p>

          <div class="mt-6 flex flex-wrap justify-center gap-1.5 max-w-sm mx-auto">
            <span class="text-xs font-semibold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md">FL (플립러닝)</span>
            <span class="text-xs font-semibold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md">PBL</span>
            <span class="text-xs font-semibold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md">IC-PBL</span>
            <span class="text-xs font-semibold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md">PjBL</span>
            <span class="text-xs font-semibold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md">IC-PjBL</span>
          </div>

          <button onclick="startQuiz()" class="mt-8 w-full sm:w-auto px-10 py-4 bg-gnu-sky hover:bg-gnu-dark text-white font-bold text-base rounded-2xl shadow-lg shadow-sky-200 transition-all transform hover:-translate-y-0.5 cursor-pointer">
            탐색 시작하기 →
          </button>

          <div class="mt-8 pt-6 border-t border-slate-100 text-left">
            <p class="text-xs font-bold text-slate-500 mb-2">유형을 이미 알고 계신가요? 바로 신청서를 작성할 수 있습니다.</p>
            <div class="flex flex-wrap gap-1.5">
              ${Object.entries(FORM_TYPES).map(([k, v]) => `<button onclick="openApplicationForm('${k}')" class="text-xs font-semibold border border-sky-200 text-gnu-dark hover:bg-gnu-light px-2.5 py-1.5 rounded-lg transition cursor-pointer">서식${v.formNo} ${v.code}</button>`).join('')}
            </div>
            ${savedType && FORM_TYPES[savedType] ? `<button onclick="openApplicationForm('${savedType}')" class="mt-3 text-sm font-bold text-gnu-sky hover:text-gnu-dark underline underline-offset-2 cursor-pointer">작성 중인 ${FORM_TYPES[savedType].code} 신청서 이어서 쓰기 →</button>` : ''}
          </div>
        </div>
      `;
    }

    function startQuiz() {
      historyStack = [];
      renderQuestion('q1');
    }

    // 질문 화면 렌더링
    function renderQuestion(qKey) {
      const q = questions[qKey];
      progressContainer.classList.remove('hidden');
      progressBar.style.width = `${q.progress}%`;

      appContent.innerHTML = `
        <div class="fade-in">
          <div class="flex items-center justify-between mb-6">
            <span class="text-xs font-bold text-gnu-sky bg-gnu-light px-3 py-1 rounded-full">
              ${q.badge}
            </span>
            ${historyStack.length > 0 ? `
              <button onclick="goBack()" class="text-xs font-semibold text-slate-400 hover:text-gnu-charcoal flex items-center gap-1 transition cursor-pointer">
                ← 이전 질문
              </button>
            ` : ''}
          </div>

          <h2 class="text-xl sm:text-2xl font-extrabold text-gnu-charcoal leading-snug whitespace-pre-line">
            ${q.text}
          </h2>
          
          <p class="mt-3 text-sm text-slate-500 bg-slate-50 p-3.5 rounded-xl border border-slate-100 leading-relaxed break-keep">
            ${q.subText}
          </p>

          <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            <button onclick="handleAnswer('${qKey}', 'yes')" class="group flex items-center justify-between p-5 rounded-2xl border-2 border-sky-100 bg-white hover:border-gnu-sky hover:bg-gnu-light/40 transition-all text-left cursor-pointer">
              <div>
                <span class="block text-xs font-bold text-gnu-sky mb-0.5">YES</span>
                <span class="text-lg font-extrabold text-gnu-charcoal group-hover:text-gnu-dark">예, 그렇습니다</span>
              </div>
              <span class="w-8 h-8 rounded-full bg-gnu-light text-gnu-sky group-hover:bg-gnu-sky group-hover:text-white flex items-center justify-center font-bold transition">
                O
              </span>
            </button>

            <button onclick="handleAnswer('${qKey}', 'no')" class="group flex items-center justify-between p-5 rounded-2xl border-2 border-slate-100 bg-white hover:border-slate-400 hover:bg-slate-50 transition-all text-left cursor-pointer">
              <div>
                <span class="block text-xs font-bold text-slate-400 mb-0.5">NO</span>
                <span class="text-lg font-extrabold text-gnu-charcoal">아니오</span>
              </div>
              <span class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 group-hover:bg-slate-600 group-hover:text-white flex items-center justify-center font-bold transition">
                X
              </span>
            </button>
          </div>
        </div>
      `;
    }

    function handleAnswer(currentKey, choice) {
      historyStack.push(currentKey);
      const nextStep = questions[currentKey][choice];
      if (nextStep.type === 'question') {
        renderQuestion(nextStep.target);
      } else {
        renderResult(nextStep.target);
      }
    }

    function goBack() {
      if (historyStack.length > 0) {
        const prevKey = historyStack.pop();
        renderQuestion(prevKey);
      } else {
        renderStart();
      }
    }

    // 결과 화면 렌더링
    function renderResult(resultKey) {
      const res = results[resultKey];
      progressBar.style.width = '100%';
      const isNone = resultKey === 'NONE';

      appContent.innerHTML = `
        <div class="fade-in text-center">
          <span class="inline-block text-xs font-bold text-gnu-sky bg-gnu-light px-3 py-1 rounded-full mb-4">
            탐색 결과
          </span>

          <div class="bg-gradient-to-b from-gnu-light/70 to-white border-2 ${isNone ? 'border-slate-200' : 'border-gnu-sky'} rounded-3xl p-6 sm:p-8 shadow-sm">
            <div class="w-16 h-16 mx-auto bg-white rounded-2xl shadow-sm border border-sky-100 flex items-center justify-center mb-4">
              ${res.icon}
            </div>

            <div class="inline-block px-3 py-1 rounded-lg ${isNone ? 'bg-slate-500' : 'bg-gnu-sky'} text-white font-black text-sm tracking-wide mb-2">
              ${res.code}
            </div>

            <h2 class="text-2xl sm:text-3xl font-extrabold text-gnu-charcoal">
              ${res.title}
            </h2>
            <p class="text-xs sm:text-sm font-semibold text-slate-400 mt-1">
              ${res.engTitle}
            </p>

            <div class="my-5 border-t border-sky-100"></div>

            <p class="text-sm sm:text-base text-gnu-charcoal font-medium leading-relaxed break-keep">
              ${res.description}
            </p>
          </div>

          <div class="mt-4 bg-amber-50/80 border border-amber-200/80 rounded-2xl p-4 text-left text-xs sm:text-sm text-slate-700 leading-relaxed break-keep">
            ${res.tip}
          </div>

          ${isNone ? '' : `
          <button onclick="openApplicationForm('${resultKey}')" class="mt-6 w-full py-4 px-4 rounded-2xl bg-gnu-charcoal hover:bg-slate-700 text-white font-bold text-base shadow-lg transition cursor-pointer">
            ${res.code} 신청서(개발 및 운영계획서) 작성하기 →
          </button>`}

          <div class="mt-3 flex flex-col sm:flex-row gap-3">
            <button onclick="goBack()" class="flex-1 py-3.5 px-4 rounded-xl border border-slate-200 text-slate-600 font-bold text-sm hover:bg-slate-50 transition cursor-pointer">
              ← 이전 단계로
            </button>
            <button onclick="renderStart()" class="flex-1 py-3.5 px-4 rounded-xl bg-gnu-sky hover:bg-gnu-dark text-white font-bold text-sm shadow-md shadow-sky-100 transition cursor-pointer">
              처음부터 다시 탐색하기
            </button>
          </div>
        </div>
      `;
    }

    function openFaqModal() {
      document.getElementById('faq-modal').classList.remove('hidden');
    }
    function closeFaqModal() {
      document.getElementById('faq-modal').classList.add('hidden');
    }

    renderStart();
  </script>
</body>
</html>
